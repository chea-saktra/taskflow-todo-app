<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- === SEO Meta Tags === -->
    <title>TaskFlow - Modern Task Management & Productivity App</title>
    <meta
      name="description"
      content="A modern, fast, and responsive Task Management Web Application built with vanilla JavaScript. Organize tasks, boost productivity, and customize your workflow effortlessly." />
    <meta
      name="keywords"
      content="task management, todo app, productivity app, javascript todo list, taskflow, project management, vanilla js app" />
    <meta name="author" content="TaskFlow Team" />
    <meta name="robots" content="index, follow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- === Open Graph / Facebook & LinkedIn Meta Tags === -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yourdomain.com/" />
    <meta
      property="og:title"
      content="TaskFlow - Modern Task Management & Productivity App" />
    <meta
      property="og:description"
      content="Organize tasks, boost productivity, and customize your workflow effortlessly with TaskFlow." />
    <meta
      property="og:image"
      content="https://yourdomain.com/assets/og-image.png" />

    <!-- === Twitter Card Meta Tags === -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://yourdomain.com/" />
    <meta
      name="twitter:title"
      content="TaskFlow - Modern Task Management & Productivity App" />
    <meta
      name="twitter:description"
      content="Organize tasks, boost productivity, and customize your workflow effortlessly." />
    <meta
      name="twitter:image"
      content="https://yourdomain.com/assets/og-image.png" />

    <!-- === Theme Color for Mobile Browsers === -->
    <meta name="theme-color" content="#6366f1" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      href="/favicon/favicon-96x96.png"
      sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="TaskFlow" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div id="app"></div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
